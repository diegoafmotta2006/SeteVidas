<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover permite usar a tela inteira (edge-to-edge),
         inclusive atrás do notch e da barra de gestos do celular. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>SeteVidas</title>
    <meta name="description" content="SeteVidas - memórias de duas vidas." />

    <!-- Cor da barra do sistema (Android) e do navegador -->
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS: instalação na tela inicial em modo aplicativo -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SeteVidas" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
